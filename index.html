<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Transportes El Cóndor</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --tg-color: #0088cc;
            --wa-color: #25d366;
            --bg-color: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .main-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 30px; }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-telegram { background-color: var(--tg-color); }
        .btn-whatsapp { background-color: var(--wa-color); }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Prueba de Conceptos</h1>
        <p>Seleccione el canal de comunicación para validar los requerimientos.</p>

        <div class="button-group">
            <a href="telegram.html" class="btn btn-telegram">Validar Bot de Telegram</a>

            <a href="whats.html" class="btn btn-whatsapp">Validar Bot de WhatsApp</a>
        </div>

        <footer>
            Prototipado Técnico
        </footer>
    </div>

</body>
</html>
